name: Release

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force_contracts:
        description: "Bypass contract gate (set to true when extraction legitimately changed)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      version: ${{ steps.check.outputs.latest }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_PAT }}
          fetch-tags: true

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check for new version
        id: check
        run: |
          LATEST=$(npm view @anthropic-ai/claude-code version)
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest Claude Code: $LATEST"
          # Skip only if this version is already published to npm. Keying on the
          # git tag strands a release whenever publish fails after the tag push.
          if [ "$(npm view "claudecode-linter@$LATEST" version 2>/dev/null)" = "$LATEST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "claudecode-linter@$LATEST already on npm — nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "claudecode-linter@$LATEST not on npm — will release."
          fi

      - name: Extract contracts
        if: steps.check.outputs.skip == 'false'
        env:
          FORCE_CONTRACTS: ${{ inputs.force_contracts && '1' || '0' }}
        run: |
          npx tsx scripts/extract-contracts.ts --changelog
          npx tsx scripts/extract-plugin-schema.ts
          npx tsx scripts/generate-contracts.ts

      - name: Fetch schemastore.org schemas
        if: steps.check.outputs.skip == 'false'
        # gitea#6: pull canonical Claude Code JSON schemas from
        # schemastore.org and commit them so the linter ships with both
        # the Zod-extracted contracts (runtime truth) and the schemastore
        # copies (used as the sole source for marketplace + keybindings).
        run: npx tsx scripts/fetch-schemastore.ts

      - name: Build and test
        if: steps.check.outputs.skip == 'false'
        run: |
          npm run build
          npm test

      - name: Prepare release
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.check.outputs.latest }}"

          # Bump package.json version
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(p, null, '\t') + '\n');
          " "$VERSION"
          npm install --package-lock-only

          # Prepend changelog entry (idempotent — skip if v$VERSION already on top)
          if grep -q "^## $VERSION " CHANGELOG.md 2>/dev/null; then
            echo "CHANGELOG.md already documents v$VERSION — skipping prepend."
          elif [ -f CHANGELOG.md ]; then
            tail -n +2 CHANGELOG.md > CHANGELOG_OLD.md
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            cat CHANGELOG_ENTRY.md >> CHANGELOG.md
            cat CHANGELOG_OLD.md >> CHANGELOG.md
            rm CHANGELOG_OLD.md
          else
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            cat CHANGELOG_ENTRY.md >> CHANGELOG.md
          fi

          # Create tarball
          npm pack --ignore-scripts
          echo "tarball=$(ls *.tgz)" >> "$GITHUB_ENV"

      - name: Commit, tag, and push
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.check.outputs.latest }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "release: sync with Claude Code v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION" 2>/dev/null || echo "tag v$VERSION already exists"
          git push origin HEAD || true
          git push origin "v$VERSION" || true

      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: |
          # Trusted publishing (OIDC) needs npm >= 11.5.1; setup-node's Node 20 ships npm 10.
          # Pinned to 11: npm 12 requires Node >= 22 and refuses to install here.
          npm install -g npm@11
          npm publish --ignore-scripts --access public --provenance

      - name: Create GitHub Release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          VERSION="${{ steps.check.outputs.latest }}"

          # Build release body
          BODY=$(node -e "
            const changelog = require('fs').readFileSync('CHANGELOG_ENTRY.md', 'utf8');
            const install = [
              '### Install',
              '',
              '\`\`\`bash',
              'npm install claudecode-linter@$VERSION',
              '\`\`\`',
              '',
            ].join('\n');
            process.stdout.write(install + changelog);
          ")

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — skipping."
          else
            gh release create "v$VERSION" \
              --title "v$VERSION" \
              --notes "$BODY" \
              "${{ env.tarball }}"
          fi

          rm -f CHANGELOG_ENTRY.md *.tgz

  docker:
    name: Docker images
    needs: release
    if: ${{ needs.release.outputs.skip == 'false' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-images.yml
    with:
      version: ${{ needs.release.outputs.version }}
