name: Docker images

# Reusable: called as the final step of the release / patch-release workflows
# so image publishing is part of the same run, not a separate event-triggered
# process. Also dispatchable on its own for a manual rebuild.
on:
  workflow_call:
    inputs:
      version:
        description: "Version tag to apply alongside :latest (empty = :latest only)"
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to apply alongside :latest (empty = :latest only)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

# The docker/* actions still bundle Node.js 20 (deprecated on GitHub runners).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  docker:
    name: Build and push (${{ matrix.variant.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: node
            dockerfile: Dockerfile
            image: ghcr.io/retif/node-claudecode-linter
          - name: bun
            dockerfile: Dockerfile.compile
            image: ghcr.io/retif/bun-claudecode-linter
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The caller pushes a version-bump commit before this runs; build the
          # current main, not the pre-bump SHA the caller started from.
          ref: main

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.variant.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.variant.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
