name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Self-lint
        run: node dist/index.js tests/fixtures/valid-plugin/ || true

      # Reads the vendored contracts/module-replacements/ snapshot — no
      # network at gate time, so a third-party edit cannot redden this run
      # (oleks/claudecode-linter#25). Refresh via the
      # refresh-module-replacements workflow.
      - name: Check replaceable dependencies
        run: npm run check-deps

      - name: Find unused code
        run: npm run knip

      - name: Validate package publishing
        run: npx publint

  release-dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Extract contracts (dry-run)
        # Pin the extractor to the version `npm view` resolves, as release.yml
        # does (oleks/claudecode-linter#30). Unpinned, `npm pack` served
        # 2.1.197 while the `latest` dist-tag said 2.1.301, so this job
        # compared a two-hundred-release-old contract set against the committed
        # one and reported `tools: changed` on every PR and every push to
        # main — including the release commit that had just refreshed the
        # contracts (oleks/claudecode-linter#50).
        run: |
          LATEST=$(npm view @anthropic-ai/claude-code version)
          echo "Extracting contracts from Claude Code $LATEST"
          npx tsx scripts/extract-contracts.ts --version "$LATEST"
          # The schema extractor is what release.yml runs next, and the step
          # that broke it on 2.1.322 (Plugin schema gate) — without it here a
          # moved anchor stayed invisible to every PR while Release failed on
          # each scheduled run.
          npx tsx scripts/extract-plugin-schema.ts --version "$LATEST"

      - name: Generate contracts
        run: npm run generate-contracts

      - name: Check for contract value changes
        # Advisory, not fatal. Value drift means Claude Code shipped since the
        # last release commit; release.yml picks it up on its next run, and no
        # PR can fix it. Failing here failed every PR in that window (all of
        # Dependabot's, indefinitely while Release was broken). A broken
        # extractor still fails the steps above.
        run: |
          # Compare contract values only (ignore timestamps, formatting, whitespace)
          # Extract just the contracts object from both old and new JSON, sort keys
          node -e '
            const fs = require("fs");
            const committed = JSON.parse(require("child_process").execSync("git show HEAD:contracts/claude-code-contracts.json", {encoding:"utf8"}));
            const current = JSON.parse(fs.readFileSync("contracts/claude-code-contracts.json", "utf8"));
            const norm = (obj) => JSON.stringify(obj.contracts, Object.keys(obj.contracts).sort());
            if (norm(committed) !== norm(current)) {
              const changed = Object.keys(current.contracts).filter(
                (k) => JSON.stringify(committed.contracts[k]) !== JSON.stringify(current.contracts[k]));
              console.log("Contract values changed — the next release run will pick these up:");
              for (const k of changed) console.log("  " + k + ": changed");
              console.log("::warning title=Contract drift::Claude Code contracts changed since the last release (" + changed.join(", ") + "); release.yml will refresh them.");
              process.exit(0);
            }
            console.log("Contract values unchanged (only timestamp/formatting differs).");
          '
