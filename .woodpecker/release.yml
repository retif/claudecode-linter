# Woodpecker CI: Sync linter contracts with latest Claude Code version.
#
# Trigger: manual (will be cron in the future).
# Secrets required:
#   REGISTRY_TOKEN   — git push (Woodpecker secret still named gitea_token) + npm publish + release creation

# oleks/fleet#230 — MANDATORY explicit arch label. Woodpecker's queue filter only
# constrains labels a task DECLARES, so an unlabelled workflow matches EVERY agent,
# including amd64-dispatch (407), whose step pods provision a paid ephemeral amd64
# spot VM. Every pipeline must pin its arch explicitly.
labels:
  arch: arm64

when:
  event: manual

steps:
  # ----------------------------------------------------------------
  # 1. Install + check for new version
  # ----------------------------------------------------------------
  check-version:
    image: node:20
    commands:
      - echo "▸ arch=$(uname -m)"
      - bash ci/check-version.sh

  # ----------------------------------------------------------------
  # 2. Extract contracts + generate + build + test
  # ----------------------------------------------------------------
  build:
    image: node:20
    environment:
      FORCE_CONTRACTS: ${CI_PIPELINE_PARAM_FORCE_CONTRACTS:-0}
    commands:
      - echo "▸ arch=$(uname -m)"
      - bash ci/build-release-artifacts.sh

  # ----------------------------------------------------------------
  # 3. Bump, commit, tag, push, publish, release
  #    (single step — Woodpecker only injects secrets into one step)
  # ----------------------------------------------------------------
  release:
    image: node:20
    environment:
      # Single token env var across CI + local (oleks/emmett#44). The Woodpecker
      # secret may still be named `gitea_token`; we expose it as $REGISTRY_TOKEN
      # so the shared ci/ scripts resolve it identically in CI and on emmett.
      REGISTRY_TOKEN:
        from_secret: gitea_token
    commands:
      - echo "▸ arch=$(uname -m)"
      - bash ci/release.sh
